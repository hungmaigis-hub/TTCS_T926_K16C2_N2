<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem và Duyệt File</title>
  <style>
    .viewer-container {
      max-width: 800px;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    .file-frame {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      color: #fff;
    }
    .btn-approve {
      background-color: #28a745;
    }
    .btn-reject {
      background-color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="viewer-container">
    <h3>Xem tài liệu & Phê duyệt</h3>

    <!-- Khung nhúng xem file bằng <iframe> -->
    <iframe id="fileViewer" class="file-frame" src=""></iframe>

    <!-- 2 nút Duyệt / Từ chối -->
    <div class="actions-bar">
      <button type="button" class="btn btn-reject" onclick="updateFileStatus('rejected')">Từ chối</button>
      <button type="button" class="btn btn-approve" onclick="updateFileStatus('approved')">Duyệt</button>
    </div>
  </div>

  <script>
    const currentFileId = 1; // ID của file cần duyệt

    // 1. Load dữ liệu file lên khung nhúng <iframe>
    async function loadFile(fileId) {
      try {
        // Gửi API lấy thông tin đường dẫn file (thay URL bằng API thực tế)
        const response = await fetch(`http://127.0.0.1:8000/api/v1`);
        const data = await response.json();

        // Gán link file vào iframe
        document.getElementById('fileViewer').src = data.fileUrl;
      } catch (error) {
        console.error('Lỗi khi tải file:', error);
      }
    }

    // 2. Gửi API cập nhật trạng thái khi bấm Duyệt hoặc Từ chối
    async function updateFileStatus(status) {
      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: status })
        });

        if (response.ok) {
          alert(`Đã cập nhật trạng thái: ${status === 'approved' ? 'Duyệt' : 'Từ chối'} thành công!`);
        } else {
          alert('Cập nhật trạng thái thất bại!');
        }
      } catch (error) {
        console.error('Lỗi khi gửi API cập nhật trạng thái:', error);
      }
    }

    // Tự động load dữ liệu file khi trang tải xong
    window.onload = () => loadFile(currentFileId);
  </script>

</body>
</html>

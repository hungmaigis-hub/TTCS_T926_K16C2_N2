<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng hợp Báo cáo Kết quả Thực tập</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 30px 20px;
    }

    .report-container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Bộ lọc Filters */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 24px;
    }

    .filter-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: #fff;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    /* Nút bấm */
    .btn {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--success);
      color: #fff;
    }
    .btn-success:hover {
      background-color: var(--success-hover);
    }

    /* Bảng dữ liệu */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: #334155;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
    }

    .badge-excellent { background-color: #dcfce7; color: #15803d; }
    .badge-good { background-color: #e0f2fe; color: #0369a1; }
    .badge-pass { background-color: #fef9c3; color: #a16207; }
  </style>
</head>
<body>

  <div class="report-container">
    
    <!-- Tiêu đề & Nút xuất báo cáo -->
    <div class="header-bar">
      <div class="header-title">
        <h2>Báo Cáo Tổng Hợp Kết Quả Thực Tập</h2>
        <p>Thống kê chi tiết đánh giá kết quả thực tập sinh theo các tiêu chí</p>
      </div>
      <button type="button" class="btn btn-success" onclick="exportSummaryReport()">
        Xuất báo cáo tổng kết
      </button>
    </div>

    <!-- Thanh bộ lọc (Đợt / Trường / Phòng ban) -->
    <div class="filter-bar">
      <div class="filter-group">
        <label for="cohortFilter">Đợt thực tập:</label>
        <select id="cohortFilter" class="form-control">
          <option value="">Tất cả các đợt</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="universityFilter">Trường đại học:</label>
        <select id="universityFilter" class="form-control">
          <option value="">Tất cả các trường</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="departmentFilter">Phòng ban:</label>
        <select id="departmentFilter" class="form-control">
          <option value="">Tất cả phòng ban</option>
        </select>
      </div>

      <button type="button" class="btn btn-primary" onclick="loadReportData()">
        Lọc dữ liệu
      </button>
    </div>

    <!-- Bảng tổng hợp dữ liệu -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Mã TTS</th>
            <th>Họ và Tên</th>
            <th>Trường</th>
            <th>Đợt thực tập</th>
            <th>Phòng ban</th>
            <th>Điểm số</th>
            <th>Xếp loại</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr>
            <td colspan="8" style="text-align: center; color: #888;">Đang tải dữ liệu báo cáo...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // 1. Load các danh mục bộ lọc (Đợt, Trường, Phòng ban) từ API
    async function loadFilterOptions() {
      try {
        const response = await fetch('https://api.example.com/reports/filters');
        const data = await response.json();

        // Đổ dữ liệu vào select Đợt
        const cohortSelect = document.getElementById('cohortFilter');
        data.cohorts.forEach(c => cohortSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);

        // Đổ dữ liệu vào select Trường
        const uniSelect = document.getElementById('universityFilter');
        data.universities.forEach(u => uniSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`);

        // Đổ dữ liệu vào select Phòng ban
        const deptSelect = document.getElementById('departmentFilter');
        data.departments.forEach(d => deptSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`);
      } catch (error) {
        console.error('Lỗi khi tải bộ lọc:', error);
      }
    }

    // 2. Dùng JS gọi API lấy dữ liệu bảng báo cáo theo bộ lọc
    async function loadReportData() {
      const cohort = document.getElementById('cohortFilter').value;
      const university = document.getElementById('universityFilter').value;
      const department = document.getElementById('departmentFilter').value;
      const tbody = document.getElementById('reportTableBody');

      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Đang lọc dữ liệu...</td></tr>';

      try {
        // Gửi query param lên API
        const query = new URLSearchParams({ cohort, university, department }).toString();
        const response = await fetch(`https://api.example.com/reports/interns-summary?${query}`);
        const list = await response.json();

        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Không tìm thấy dữ liệu phù hợp.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        list.forEach((item, index) => {
          let badgeClass = 'badge-pass';
          if (item.grade >= 8.5) badgeClass = 'badge-excellent';
          else if (item.grade >= 7.0) badgeClass = 'badge-good';

          tbody.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td><strong>${item.internCode}</strong></td>
              <td>${item.fullName}</td>
              <td>${item.university}</td>
              <td>${item.cohort}</td>
              <td>${item.department}</td>
              <td><strong>${item.grade}</strong></td>
              <td><span class="badge ${badgeClass}">${item.rating}</span></td>
            </tr>
          `;
        });
      } catch (error) {
        console.error('Lỗi khi tải dữ liệu bảng:', error);
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Lỗi khi tải dữ liệu báo cáo.</td></tr>';
      }
    }

    // 3. Gửi API / Kích hoạt xuất báo cáo tổng kết
    async function exportSummaryReport() {
      const cohort = document.getElementById('cohortFilter').value;
      const university = document.getElementById('universityFilter').value;
      const department = document.getElementById('departmentFilter').value;

      try {
        const query = new URLSearchParams({ cohort, university, department }).toString();
        const response = await fetch(`https://api.example.com/reports/export-summary?${query}`, {
          method: 'GET'
        });

        if (response.ok) {
          alert('Đang tạo và xuất báo cáo tổng kết thành công!');
        } else {
          alert('Xuất báo cáo thất bại!');
        }
      } catch (error) {
        console.error('Lỗi khi xuất báo cáo:', error);
      }
    }

    // Khởi tạo trang: tải bộ lọc và tải dữ liệu bảng mặc định
    window.onload = async () => {
      await loadFilterOptions();
      loadReportData();
    };
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộ trình thực tập sinh</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 30px;
    }
    .timeline-container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .timeline-title {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    /* Cấu trúc Timeline CSS */
    .timeline {
      position: relative;
      padding-left: 30px;
      border-left: 3px solid #e9ecef;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 30px;
    }
    .timeline-item:last-child {
      margin-bottom: 0;
    }
    /* Điểm mốc tròn */
    .timeline-dot {
      position: absolute;
      left: -38px;
      top: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #adb5bd;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #adb5bd;
    }
    .status-completed .timeline-dot {
      background: #28a745;
      box-shadow: 0 0 0 2px #28a745;
    }
    .status-in_progress .timeline-dot {
      background: #007bff;
      box-shadow: 0 0 0 2px #007bff;
    }
    .timeline-content {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .timeline-phase {
      font-size: 16px;
      font-weight: bold;
      color: #212529;
    }
    .timeline-time {
      font-size: 13px;
      color: #6c757d;
    }
    .timeline-desc {
      font-size: 14px;
      color: #495057;
      margin: 0 0 12px 0;
      line-height: 1.5;
    }
    .status-select {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ced4da;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="timeline-container">
    <h2 class="timeline-title">Lộ trình & Lịch làm việc Thực tập sinh</h2>

    <!-- Khung Timeline sẽ được render bằng JS -->
    <div id="timelineList" class="timeline">
      <p>Đang tải lộ trình...</p>
    </div>
  </div>

  <script>
    const internId = 1; // ID thực tập sinh

    // 1. Dùng JS gọi API lấy dữ liệu lộ trình và render ra giao diện
    async function loadTimeline(id) {
      const container = document.getElementById('timelineList');
      try {
        // Thay URL bằng API thực tế
        const response = await fetch(`https://api.example.com/interns/${id}/roadmap`);
        const roadmapData = await response.json();

        // Xóa nội dung chờ và đổ dữ liệu
        container.innerHTML = '';
        roadmapData.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = `timeline-item status-${item.status}`;
          
          itemDiv.innerHTML = `
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <div class="timeline-header">
                <span class="timeline-phase">${item.phase}</span>
                <span class="timeline-time">${item.time}</span>
              </div>
              <p class="timeline-desc">${item.description}</p>
              <div>
                <label style="font-size: 13px; font-weight: bold;">Trạng thái: </label>
                <select class="status-select" onchange="updateMilestoneStatus(${item.id}, this.value)">
                  <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Chưa bắt đầu</option>
                  <option value="in_progress" ${item.status === 'in_progress' ? 'selected' : ''}>Đang thực hiện</option>
                  <option value="completed" ${item.status === 'completed' ? 'selected' : ''}>Đã hoàn thành</option>
                </select>
              </div>
            </div>
          `;
          container.appendChild(itemDiv);
        });
      } catch (error) {
        console.error('Lỗi khi tải dữ liệu timeline:', error);
        container.innerHTML = '<p>Lỗi tải dữ liệu lộ trình thực tập sinh.</p>';
      }
    }

    // 2. Gửi API cập nhật trạng thái của từng giai đoạn
    async function updateMilestoneStatus(milestoneId, newStatus) {
      try {
        const response = await fetch(`https://api.example.com/roadmap/milestones/${milestoneId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: newStatus })
        });

        if (response.ok) {
          alert('Cập nhật trạng thái giai đoạn thành công!');
          loadTimeline(internId); // Tải lại để cập nhật màu sắc mốc tiến độ
        } else {
          alert('Cập nhật trạng thái thất bại!');
        }
      } catch (error) {
        console.error('Lỗi khi gửi API cập nhật trạng thái:', error);
      }
    }

    // Tự động load timeline khi mở trang
    window.onload = () => loadTimeline(internId);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa thông tin</title>
  <style>
    /* CSS Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      width: 350px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- Nút kích hoạt mở Modal chỉnh sửa -->
  <button onclick="openEditModal(1)">Chỉnh sửa người dùng (ID: 1)</button>

  <!-- Giao diện Modal / Form chỉnh sửa -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Chỉnh sửa thông tin</h3>
      <form id="editForm">
        <!-- Input ẩn lưu ID -->
        <input type="hidden" id="editId" name="id">

        <div class="form-group">
          <label for="editName">Họ và tên:</label>
          <input type="text" id="editName" name="name" required>
        </div>

        <div class="form-group">
          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail" name="email" required>
        </div>

        <div class="form-group">
          <label for="editPhone">Số điện thoại:</label>
          <input type="tel" id="editPhone" name="phone" required>
        </div>

        <div class="modal-actions">
          <button type="button" onclick="closeModal()">Hủy</button>
          <button type="submit">Cập nhật</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById('editModal');
    const form = document.getElementById('editForm');

    // 1. Mở modal & Load dữ liệu cũ lên các ô input
    async function openEditModal(id) {
      modal.style.display = 'flex';

      try {
        // Gửi request lấy dữ liệu cũ theo ID (thay URL bằng API thực tế)
        const response = await fetch(`https://api.example.com/users/${id}`);
        const data = await response.json();

        // Gán dữ liệu cũ vào từng ô input
        document.getElementById('editId').value = data.id;
        document.getElementById('editName').value = data.name;
        document.getElementById('editEmail').value = data.email;
        document.getElementById('editPhone').value = data.phone;
      } catch (error) {
        console.error('Lỗi khi tải dữ liệu cũ:', error);
      }
    }

    // Đóng modal
    function closeModal() {
      modal.style.display = 'none';
      form.reset();
    }

    // 2. Bắt sự kiện submit form & Gửi API cập nhật
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const id = document.getElementById('editId').value;
      const updateData = {
        name: document.getElementById('editName').value,
        email: document.getElementById('editEmail').value,
        phone: document.getElementById('editPhone').value
      };

      try {
        // Gửi API cập nhật (PUT/PATCH)
        const response = await fetch(`https://api.example.com/users/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updateData)
        });

        if (response.ok) {
          alert('Cập nhật thành công!');
          closeModal();
        } else {
          alert('Cập nhật thất bại!');
        }
      } catch (error) {
        console.error('Lỗi khi gửi API cập nhật:', error);
      }
    });
  </script>

</body>
</html>

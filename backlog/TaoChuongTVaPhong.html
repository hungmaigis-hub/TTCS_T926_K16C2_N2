<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo chương trình</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Tạo chương trình mới</h2>
    <form id="createProgramForm">
      
      <!-- Tên chương trình -->
      <div class="form-group">
        <label for="programName">Tên chương trình:</label>
        <input type="text" id="programName" name="name" placeholder="Nhập tên chương trình..." required>
      </div>

      <!-- Select chọn phòng ban -->
      <div class="form-group">
        <label for="departmentSelect">Phòng ban phụ trách:</label>
        <select id="departmentSelect" name="departmentId" required>
          <option value="">-- Đang tải danh sách phòng ban... --</option>
        </select>
      </div>

      <!-- Textarea nhập mô tả -->
      <div class="form-group">
        <label for="programDescription">Mô tả chương trình:</label>
        <textarea id="programDescription" name="description" rows="5" placeholder="Nhập nội dung mô tả chi tiết..." required></textarea>
      </div>

      <!-- Nút submit -->
      <button type="submit" class="btn-submit">Tạo chương trình</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('createProgramForm');
    const departmentSelect = document.getElementById('departmentSelect');

    // 1. Dùng JS gọi API load danh sách phòng ban vào thẻ <select>
    async function loadDepartments() {
      try {
        // Thay URL bằng API thực tế của bạn
        const response = await fetch('https://api.example.com/departments');
        const departments = await response.json();

        // Xóa option chờ và render danh sách phòng ban
        departmentSelect.innerHTML = '<option value="">-- Chọn phòng ban --</option>';
        departments.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept.id;
          option.textContent = dept.name;
          departmentSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Lỗi khi tải phòng ban:', error);
        departmentSelect.innerHTML = '<option value="">Lỗi tải danh sách phòng ban</option>';
      }
    }

    // 2. Gửi API tạo mới khi người dùng submit form
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const newProgramData = {
        name: document.getElementById('programName').value,
        departmentId: document.getElementById('departmentSelect').value,
        description: document.getElementById('programDescription').value
      };

      try {
        const response = await fetch('https://api.example.com/programs', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(newProgramData)
        });

        if (response.ok) {
          alert('Tạo chương trình thành công!');
          form.reset();
        } else {
          alert('Tạo chương trình thất bại!');
        }
      } catch (error) {
        console.error('Lỗi khi gửi API tạo chương trình:', error);
      }
    });

    // Tự động load danh sách phòng ban khi mở trang
    window.onload = loadDepartments;
  </script>

</body>
</html>

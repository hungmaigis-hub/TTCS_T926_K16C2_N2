<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi yêu cầu hỗ trợ - Thực tập sinh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .form-header {
      margin-bottom: 24px;
    }

    .form-header h2 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .required-star {
      color: #ef4444;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f8fafc;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Hộp thông báo trạng thái */
    .alert-box {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .alert-success {
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .alert-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2>Yêu cầu hỗ trợ thực tập</h2>
      <p>Vui lòng điền đầy đủ thông tin để bộ phận quản trị xử lý hồ sơ.</p>
    </div>

    <!-- Hộp thông báo phản hồi từ hệ thống -->
    <div id="statusAlert" class="alert-box" role="alert"></div>

    <form id="supportForm">
      <!-- Dropdown chọn loại giấy tờ -->
      <div class="form-group">
        <label for="documentType">Loại yêu cầu / Giấy tờ <span class="required-star">*</span></label>
        <select id="documentType" name="documentType" required>
          <option value="" disabled selected>-- Chọn loại giấy tờ --</option>
          <option value="giấy xác nhận thực tập">Giấy xác nhận thực tập</option>
          <option value="đóng dấu mộc">Đóng dấu mộc</option>
          <option value="tài liệu dự án">Tài liệu dự án</option>
        </select>
      </div>

      <!-- Ô input tiêu đề -->
      <div class="form-group">
        <label for="title">Tiêu đề yêu cầu <span class="required-star">*</span></label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          placeholder="Ví dụ: Xin dấu mộc báo cáo tuần 8..." 
          required 
          maxlength="150"
        >
      </div>

      <!-- Thẻ textarea nội dung chi tiết -->
      <div class="form-group">
        <label for="content">Nội dung chi tiết <span class="required-star">*</span></label>
        <textarea 
          id="content" 
          name="content" 
          placeholder="Mô tả cụ thể mục đích, thời hạn cần nhận, thông tin bổ sung..." 
          required
        ></textarea>
      </div>

      <!-- Nút gửi -->
      <button type="submit" id="submitBtn" class="btn-submit">Gửi yêu cầu</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('supportForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');

    // Hàm hiển thị hộp thông báo
    function showAlert(message, type = 'success') {
      statusAlert.textContent = message;
      statusAlert.className = `alert-box alert-${type}`;
      statusAlert.style.display = 'block';

      // Tự động cuộn đến thông báo nếu form dài
      statusAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault(); // Ngăn hành vi reload trang mặc định

      // Thu thập dữ liệu từ Form
      const payload = {
        documentType: document.getElementById('documentType').value,
        title: document.getElementById('title').value.trim(),
        content: document.getElementById('content').value.trim()
      };

      // Đổi trạng thái nút bấm trong lúc gửi
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang gửi yêu cầu...';
      statusAlert.style.display = 'none';

      try {
        const response = await fetch('/api/v1/support-requests', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          // Hiển thị hộp thông báo gửi thành công
          showAlert('Yêu cầu hỗ trợ của bạn đã được gửi thành công!', 'success');
          form.reset(); // Reset form sau khi gửi thành công
        } else {
          // Xử lý khi server trả về mã lỗi HTTP
          const errData = await response.json().catch(() => null);
          const errMsg = errData?.message || `Gửi thất bại (Mã lỗi: ${response.status})`;
          showAlert(errMsg, 'error');
        }
      } catch (error) {
        // Xử lý lỗi mạng hoặc kết nối server
        console.error('Lỗi khi gửi yêu cầu:', error);
        showAlert('Không thể kết nối đến máy chủ. Vui lòng kiểm tra mạng hoặc thử lại sau.', 'error');
      } finally {
        // Khôi phục trạng thái nút gửi
        submitBtn.disabled = false;
        submitBtn.textContent = 'Gửi yêu cầu';
      }
    });
  </script>
</body>
</html>
